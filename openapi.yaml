openapi: 3.0.3
info:
  title: EM School API
  version: 0.1.0
  description: |
    School management backend (multi-tenant). Base path: `/api`.

    Auth: `Authorization: Bearer <JWT>` after `POST /auth/login` (or `/login`).

    ## Build status

    ### Done
    - Super Admin — Schools lifecycle (create/list/get/edit/status)
    - Registration codes (issue on create, ensure, regenerate)
    - Super Admin dashboard
    - School portal (grades, students, fees, attendance, teachers, schedule) — see also `swagger.yaml`
    - Auth, Parent attendance, Teacher portal

    ### ~~NOT BUILT AT ALL YET~~ (struck = now built)
    - ~~Super Admin registration codes + school edit/status + dashboard~~
    - School Admin self-registration via registration code (Module 2)
    - Student Affairs Staff as a separate role
    - Payroll / cash vouchers
    - WhatsApp absence alerts
    - Learning platform (lectures/content)

servers:
  - url: http://localhost:8000/api
    description: Local default
  - url: /api
    description: Relative

tags:
  - name: Super Admin - Schools
    description: Platform owner APIs for school accounts (users.role = school)
  - name: Auth
  - name: School Portal
  - name: Parent
  - name: Teacher Portal

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Skip:
      name: skip
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    SearchQ:
      name: q
      in: query
      schema:
        type: string
    SchoolId:
      name: schoolId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    ErrorMessage:
      type: object
      properties:
        message:
          type: string
      required: [message]

    Pagination:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        skip:
          type: integer
        hasMore:
          type: boolean

    RegistrationCode:
      type: object
      properties:
        id:
          type: integer
        schoolId:
          type: integer
        code:
          type: string
          example: REG-A1B2C3D4
        status:
          type: string
          enum: [active, revoked]
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true

    School:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        logo:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        contactPhone:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, suspended, deleted, inactive]
        role:
          type: string
          enum: [school]
        created_at:
          type: string
          format: date-time
        registrationCode:
          allOf:
            - $ref: '#/components/schemas/RegistrationCode'
          nullable: true
          description: Present on get/create/update when an active code exists

    CreateSchoolRequest:
      type: object
      required: [name, email, password, logo]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        address:
          type: string
          maxLength: 2000
        contactPhone:
          type: string
          maxLength: 20
        logo:
          type: string
          format: binary
          description: Required multipart image field

    UpdateSchoolRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        description:
          type: string
          nullable: true
        email:
          type: string
          format: email
        address:
          type: string
          nullable: true
        contactPhone:
          type: string
          nullable: true
        logo:
          type: string
          format: binary
          description: Optional replacement logo

    UpdateSchoolStatusRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [activate, suspend, soft-delete]
          description: |
            activate → status=active;
            suspend → status=suspended;
            soft-delete → status=deleted (revokes active registration code)

    AdminDashboard:
      type: object
      properties:
        schoolsCount:
          type: integer
        usersPerSchool:
          type: array
          items:
            type: object
            properties:
              schoolId:
                type: integer
              schoolName:
                type: string
              usersCount:
                type: integer
                description: School account + students + teachers + parents
        statusBreakdown:
          type: object
          additionalProperties:
            type: integer
          example:
            active: 3
            suspended: 1
            deleted: 0
            inactive: 0

paths:
  /admin/dashboard:
    get:
      tags: [Super Admin - Schools]
      summary: Super Admin dashboard aggregates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
        '403':
          description: Admin only

  /admin/schools:
    get:
      tags: [Super Admin - Schools]
      summary: List schools
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Skip'
        - $ref: '#/components/parameters/SearchQ'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  schools:
                    type: array
                    items:
                      $ref: '#/components/schemas/School'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      tags: [Super Admin - Schools]
      summary: Create school (issues registration code)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSchoolRequest'
      responses:
        '201':
          description: Created with active registrationCode
          content:
            application/json:
              schema:
                type: object
                properties:
                  school:
                    $ref: '#/components/schemas/School'
        '409':
          description: Email already in use

  /admin/schools/{schoolId}:
    get:
      tags: [Super Admin - Schools]
      summary: Get school (includes active registrationCode if any)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  school:
                    $ref: '#/components/schemas/School'
        '404':
          description: School not found
    put:
      tags: [Super Admin - Schools]
      summary: Edit school profile (address, contact, logo, …)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchoolId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateSchoolRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  school:
                    $ref: '#/components/schemas/School'
        '404':
          description: School not found
        '409':
          description: Email already in use

  /admin/schools/{schoolId}/status:
    patch:
      tags: [Super Admin - Schools]
      summary: Activate, suspend, or soft-delete a school
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchoolId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSchoolStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  school:
                    $ref: '#/components/schemas/School'
        '404':
          description: School not found

  /admin/schools/{schoolId}/registration-code:
    post:
      tags: [Super Admin - Schools]
      summary: Ensure registration code (create if missing, else return active)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: Existing active code returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  registrationCode:
                    $ref: '#/components/schemas/RegistrationCode'
        '201':
          description: New code created
          content:
            application/json:
              schema:
                type: object
                properties:
                  registrationCode:
                    $ref: '#/components/schemas/RegistrationCode'
        '400':
          description: School is deleted
        '404':
          description: School not found

  /admin/schools/{schoolId}/registration-code/regenerate:
    post:
      tags: [Super Admin - Schools]
      summary: Regenerate registration code (revokes previous active code)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchoolId'
      responses:
        '201':
          description: New code issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  registrationCode:
                    $ref: '#/components/schemas/RegistrationCode'
        '400':
          description: School is deleted
        '404':
          description: School not found
